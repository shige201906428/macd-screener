name: Update MACD data

on:
  schedule:
    # 毎朝5:00(JST) = 毎日20:00(UTC) に実行
    - cron: '0 20 * * *'
  workflow_dispatch: # 手動実行ボタンも残しておきます

# 競合を防ぐための同時実行制御
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install yfinance pandas lxml

      - name: Run update script
        run: |
          python update_data.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json exchanges.json
          git diff --cached --quiet || (git commit -m "update data" && git pull --rebase origin main && git push)
